<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Page Counter</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div id="scope-indicator" class="scope-indicator"></div>
      <button
        id="open-options"
        class="icon-btn"
        title="Настройки"
        data-i18n-title="popup.openSettings"
      >⚙</button>
    </header>

    <ul id="counter-list" class="counter-list"></ul>

    <section class="new-counter">
      <button id="toggle-new" class="primary-btn" data-i18n="popup.newCounter">
        + Новый счётчик
      </button>
      <form id="new-form" class="new-form" hidden>
        <input
          id="new-name"
          type="text"
          placeholder="Название"
          data-i18n-placeholder="popup.namePlaceholder"
          required
        />
        <div class="row">
          <label>
            <span>Scope:</span>
            <select id="new-scope">
              <option value="domain">Domain</option>
              <option value="tab">Tab</option>
              <option value="url">URL</option>
              <option value="global">Global</option>
            </select>
          </label>
          <label>
            <span data-i18n="popup.start">Старт:</span>
            <input id="new-initial" type="number" value="0" step="1" min="0" />
          </label>
          <label>
            <span data-i18n="popup.step">Шаг:</span>
            <input id="new-step" type="number" value="1" step="1" min="1" />
          </label>
        </div>
        <div class="row">
          <button type="submit" class="primary-btn" data-i18n="popup.create">Создать</button>
          <button type="button" id="cancel-new" class="ghost-btn" data-i18n="common.cancel">
            Отмена
          </button>
        </div>
      </form>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
